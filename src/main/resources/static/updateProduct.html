<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Update Product</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 0; background: #f8fafc; }
        header {
            background: #0f172a;
            color: white;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-link {
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
        }
        .container {
            width: 90%;
            max-width: 650px;
            margin: 35px auto;
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
        }
        textarea { min-height: 90px; resize: vertical; }
        button {
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            background: #e0f2fe;
            color: #075985;
            font-weight: bold;
        }
    </style>
</head>
<body>
<header>
    <h1>Update Product</h1>
    <a class="btn-link" href="product_management.html">Back</a>
</header>

<div class="container">
    <div class="form-group">
        <label>Product ID</label>
        <div style="display: flex; gap: 10px;">
            <input type="number" id="id" placeholder="Enter product ID" />
            <button type="button" style="background: #475569; padding: 10px 14px; white-space: nowrap;" onclick="fetchProductDetails()">Fetch Details</button>
        </div>
    </div>

    <div class="form-group">
        <label>Name</label>
        <input type="text" id="name" />
    </div>

    <div class="form-group">
        <label>Description</label>
        <textarea id="description"></textarea>
    </div>

    <div class="form-group">
        <label>Price</label>
        <input type="number" step="0.01" id="price" />
    </div>

    <div class="form-group">
        <label>Stock</label>
        <input type="number" id="stock" min="0" placeholder="Enter stock quantity" />
    </div>

    <div class="form-group">
        <label>Photo URL</label>
        <input type="text" id="photoUrl" />
    </div>

    <button onclick="updateProduct()">Update Product</button>

    <div id="messageArea"></div>
</div>

<script>
    async function fetchProductDetails() {
        const id = document.getElementById("id").value;
        if (!id) {
            alert("Please enter a Product ID first.");
            return;
        }

        try {
            const response = await fetch(`/viewProduct/${id}`);
            if (response.ok) {
                const product = await response.json();
                const stockVal = product.stock != null ? product.stock : (product.quantity != null ? product.quantity : "");
                document.getElementById("name").value = product.name || "";
                document.getElementById("description").value = product.description || "";
                document.getElementById("price").value = product.price != null ? product.price : "";
                document.getElementById("stock").value = stockVal;
                document.getElementById("photoUrl").value = product.photourl || product.photoUrl || "";
                document.getElementById("messageArea").innerHTML =
                    `<div class="message">Product details loaded. Current Stock: ${stockVal || 0}</div>`;
            } else {
                document.getElementById("messageArea").innerHTML =
                    `<div class="message" style="background: #fee2e2; color: #991b1b;">Product with ID ${id} not found.</div>`;
            }
        } catch (e) {
            console.error("Error fetching product:", e);
        }
    }

    async function updateProduct() {
        const photo = document.getElementById("photoUrl").value;
        const priceVal = document.getElementById("price").value;
        const stockVal = document.getElementById("stock").value;
        const stockNum = stockVal !== "" ? parseInt(stockVal) : null;
        const idVal = document.getElementById("id").value;

        if (!idVal) {
            alert("Please enter a Product ID.");
            return;
        }

        const product = {
            id: parseInt(idVal),
            name: document.getElementById("name").value,
            description: document.getElementById("description").value,
            price: priceVal !== "" ? parseFloat(priceVal) : null,
            stock: stockNum,
            quantity: stockNum,
            photoUrl: photo,
            photourl: photo
        };

        const response = await fetch("/updateProduct", {
            method: "PATCH",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(product)
        });

        const result = await response.text();

        document.getElementById("messageArea").innerHTML =
            `<div class="message">${result}</div>`;
    }
</script>
</body>
</html>
