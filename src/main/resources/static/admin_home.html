<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Home</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            padding: 30px 20px;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            color: #1e293b;
            width: 500px;
            padding: 35px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
        }

        .card h2 {
            margin-bottom: 15px;
        }

        .card p {
            color: #475569;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 13px 22px;
            border-radius: 10px;
            display: inline-block;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .user-btn {
            background: #16a34a;
        }

        .user-btn:hover {
            background: #15803d;
        }
    </style>
</head>
<body>

<header>Admin Dashboard</header>

<div class="container">
    <div class="card">
        <h2>Welcome Admin</h2>

        <p>
            Manage your Sales-Savvy store from here. You can manage products
            and users using the options below.
        </p>

        <div class="buttons">
            <a class="btn" href="product_management.html">
                Product Management
            </a>

            <a class="btn user-btn" href="user_management.html">
                User Management
            </a>
        </div>
    </div>
</div>

</body>
</html>
